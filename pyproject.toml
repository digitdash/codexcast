[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-estimator"
version = "0.1.0"
description = "Local Codex quota telemetry and reset-aware burn-rate estimates"
readme = "README.md"
license = "LicenseRef-CodexCast-Community"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plugin = ["mcp>=1.12.4,<2"]

[project.scripts]
codex-usage = "codex_usage.main:main"

[tool.setuptools.packages.find]
where = ["src"]
